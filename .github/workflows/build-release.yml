name: Build and Release CloudRedirect

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.6.8)'
        required: true
        default: 'v2.6.8'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build Android (arm64-v8a & armeabi-v7a)
        run: |
          NDK_TOOLCHAIN="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake"
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S . -B "build-android-${ABI}" \
              -DCMAKE_TOOLCHAIN_FILE="${NDK_TOOLCHAIN}" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-android-${ABI}" --target cloud_redirect_android --parallel
          done

      - name: Package Android Release Asset
        run: |
          mkdir -p dist/android/jniLibs/arm64-v8a dist/android/jniLibs/armeabi-v7a dist/android/kotlin
          cp build-android-arm64-v8a/libcloud_redirect_android.so dist/android/jniLibs/arm64-v8a/
          cp build-android-armeabi-v7a/libcloud_redirect_android.so dist/android/jniLibs/armeabi-v7a/
          cp src/platform/android/kotlin/CloudRedirectNative.kt dist/android/kotlin/
          cd dist/android
          zip -r ../cloud_redirect_android.zip jniLibs kotlin
          cd ..
          sha256sum cloud_redirect_android.zip > cloud_redirect_android.zip.sha256

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/cloud_redirect_android.zip
            dist/cloud_redirect_android.zip.sha256

  build:
    needs: [build-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure CMake
        run: cmake -S . -B build -G "Ninja Multi-Config"

      - name: Build C++ DLL and CLI
        run: cmake --build build --config Release --target cloud_redirect cloud_redirect_cli

      - name: Publish WPF GUI (CloudRedirect.exe)
        run: dotnet publish ui/CloudRedirect.csproj -c Release -r win-x64 --self-contained false -o dist/publish

      - name: Stage Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item dist/publish/CloudRedirect.exe dist/release/
          Copy-Item build/Release/cloud_redirect.dll dist/release/
          Copy-Item build/Release/cloud_redirect_cli.exe dist/release/
          Get-ChildItem dist/release/* -Include *.exe,*.dll | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/release

      - name: Determine Tag
        id: tag_name
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -match '^v[0-9]') {
            echo "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            $ver = '${{ github.event.inputs.version }}'
            if (-not $ver) { $ver = 'v2.6.8' }
            echo "tag=$ver" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: CloudRedirect ${{ steps.tag_name.outputs.tag }}
          body: |
            ## CloudRedirect (LuaTools / BetterSteamTools / OpenSteamTool Compatible)

            This release is compatible with the latest Steam updates (build 1791+), **LuaTools**, **BetterSteamTools (BST)**, and **OpenSteamTool (OST)**.

            ### Changes:
            - **Steam 1791+ Compatibility**: Fixed protobuf `CProtoBufMsg` and `AppInfoCache` dynamic offsets.
            - **BetterSteamTools / LuaTools Detection**: `CloudRedirect.exe` now recognizes `BetterSteamTools` and avoids locking the setup buttons.
            - **Auto-configuration**: Detects and configures both `bettersteamtools.toml` and `opensteamtool.toml` with `[cloud] enabled = true`.
            - **WebDAV & System Proxy**: Full WebDAV backend support and automatic system proxy handling.

            ### Included files:
            - `CloudRedirect.exe`: Standalone GUI companion app (embeds the updated `cloud_redirect.dll`).
            - `cloud_redirect.dll`: Direct Steam hook DLL (place in Steam root next to `steam.exe`).
            - `cloud_redirect_cli.exe`: CLI version.
            - `cloud_redirect_android.zip`: Android JNI libraries (`arm64-v8a`, `armeabi-v7a`) and `CloudRedirectNative.kt` binding.
          files: |
            dist/release/*
